domain: adjective
language: es
description: >
  Spanish translations of the twelve English control adjectives (Dixon's
  DIMENSION, AGE, VALUE and PHYSICAL PROPERTY classes), one basic term each,
  glossed with the English term so the sets join into translation triples.
sources:
  - citation: "Dixon, R. M. W. 1982. Where Have All the Adjectives Gone? And Other Essays in Semantics and Syntax. Mouton. Ch. 1 (first published 1977, Studies in Language 1(1):19-80)."
    role: anchor
    notes: "Universal core adjective classes (DIMENSION, AGE, VALUE, COLOR, ...); the control terms come from the non-color classes."
terms:
  - term: "grande"
    gloss: "big"
    source: "Dixon 1982"
    notes: "DIMENSION class. Apocopated 'gran' before nouns lemmatizes differently and is not matched."
  - term: "pequeño"
    gloss: "small"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "largo"
    gloss: "long"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "corto"
    gloss: "short"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "alto"
    gloss: "high"
    source: "Dixon 1982"
    notes: "DIMENSION class. Also 'tall'; 'high' in most uses."
  - term: "viejo"
    gloss: "old"
    source: "Dixon 1982"
    notes: "AGE class. 'antiguo' (old, ancient) is excluded to keep one term per gloss."
  - term: "nuevo"
    gloss: "new"
    source: "Dixon 1982"
    notes: "AGE class."
  - term: "joven"
    gloss: "young"
    source: "Dixon 1982"
    notes: "AGE class."
  - term: "bueno"
    gloss: "good"
    source: "Dixon 1982"
    notes: "VALUE class. Apocopated 'buen' is not matched."
  - term: "malo"
    gloss: "bad"
    source: "Dixon 1982"
    notes: "VALUE class. Apocopated 'mal' (also an adverb) is not matched."
  - term: "caliente"
    gloss: "hot"
    source: "Dixon 1982"
    notes: "PHYSICAL PROPERTY class."
  - term: "frío"
    gloss: "cold"
    source: "Dixon 1982"
    notes: "PHYSICAL PROPERTY class."
deviations: []
