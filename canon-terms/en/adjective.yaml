domain: adjective
language: en
description: >
  Control set for the color analysis: twelve core adjectives from Dixon's
  (1977/1982) universal adjective classes DIMENSION, AGE, VALUE and PHYSICAL
  PROPERTY. Dixon lists COLOR as one of the same core classes, so these are
  basic, high-frequency adjectives of the same part of speech with clean
  one-to-one translations, but without color-category structure. Running the
  identical pipeline on them tests whether a cross-language effect is specific
  to color.
sources:
  - citation: "Dixon, R. M. W. 1982. Where Have All the Adjectives Gone? And Other Essays in Semantics and Syntax. Mouton. Ch. 1 (first published 1977, Studies in Language 1(1):19-80)."
    role: anchor
    notes: "Universal core adjective classes (DIMENSION, AGE, VALUE, COLOR, ...); the control terms come from the non-color classes."
