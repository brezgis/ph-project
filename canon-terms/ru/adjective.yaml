domain: adjective
language: ru
description: >
  Russian translations of the twelve English control adjectives (Dixon's
  DIMENSION, AGE, VALUE and PHYSICAL PROPERTY classes), one basic term each,
  glossed with the English term so the sets join into translation triples.
sources:
  - citation: "Dixon, R. M. W. 1982. Where Have All the Adjectives Gone? And Other Essays in Semantics and Syntax. Mouton. Ch. 1 (first published 1977, Studies in Language 1(1):19-80)."
    role: anchor
    notes: "Universal core adjective classes (DIMENSION, AGE, VALUE, COLOR, ...); the control terms come from the non-color classes."
terms:
  - term: "большой"
    gloss: "big"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "маленький"
    gloss: "small"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "длинный"
    gloss: "long"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "короткий"
    gloss: "short"
    source: "Dixon 1982"
    notes: "DIMENSION class."
  - term: "высокий"
    gloss: "high"
    source: "Dixon 1982"
    notes: "DIMENSION class. Also 'tall'."
  - term: "старый"
    gloss: "old"
    source: "Dixon 1982"
    notes: "AGE class."
  - term: "новый"
    gloss: "new"
    source: "Dixon 1982"
    notes: "AGE class."
  - term: "молодой"
    gloss: "young"
    source: "Dixon 1982"
    notes: "AGE class."
  - term: "хороший"
    gloss: "good"
    source: "Dixon 1982"
    notes: "VALUE class."
  - term: "плохой"
    gloss: "bad"
    source: "Dixon 1982"
    notes: "VALUE class."
  - term: "горячий"
    gloss: "hot"
    source: "Dixon 1982"
    notes: "PHYSICAL PROPERTY class."
  - term: "холодный"
    gloss: "cold"
    source: "Dixon 1982"
    notes: "PHYSICAL PROPERTY class."
deviations: []
